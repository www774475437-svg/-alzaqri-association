name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Add Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "icons skipped"
          npx cap sync android
          # أذونات الموقع لأوقات الصلاة
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
      - name: Build
        run: cd android && ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f 4 $IN aligned.apk
          $BT/apksigner sign --ks signing/test.keystore --ks-key-alias zaqri --ks-pass pass:zaqri-test --key-pass pass:zaqri-test --out alzaqri.apk aligned.apk
          $BT/apksigner verify alzaqri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alzaqri-apk
          path: alzaqri.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: آخر نسخة
          files: alzaqri.apk
          make_latest: true
